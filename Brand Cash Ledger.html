<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brand Cash Ledger</title>
<style>
:root{--bg:#faf6f1;--card:#fff;--tx:#2b2118;--mut:#7a6a5a;--bd:#e6dccf;--ac:#c2410c;--ok:#15803d;--bad:#b91c1c;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1511;--card:#271e18;--tx:#f3e9de;--mut:#a89786;--bd:#3d3027;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1511;--card:#271e18;--tx:#f3e9de;--mut:#a89786;--bd:#3d3027;--ac:#fb923c;--ok:#4ade80;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:780px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:2px 0}h2{font-size:1rem;margin:0 0 10px}
.mut{color:var(--mut);font-size:.82rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.bal{border:1px solid var(--bd);border-radius:10px;padding:10px;background:var(--card)}.bal b{display:block;font-size:1.25rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1 1 130px}
label{display:block;font-size:.78rem;color:var(--mut);margin-bottom:2px}
input,select,button{font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border:0;font-weight:600}
button.s{width:auto;padding:3px 8px;font-size:.75rem}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs button{flex:1;font-weight:600}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pre{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.pre button{width:auto;padding:5px 10px;font-size:.8rem}
.log{list-style:none;margin:0;padding:0}.log li{padding:10px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:10px}.log li:first-child{border-top:0}
.v{text-decoration:line-through;opacity:.5}.amt{font-weight:700;white-space:nowrap;text-align:right}
.in{color:var(--ok)}.out{color:var(--bad)}.tr{color:var(--tx)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}.bar i{display:block;height:14px;background:var(--ac);border-radius:4px;min-width:2px}.bar span:first-child{width:120px;flex:none}
.cols{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:6px}.cols div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:1px}
#msg,#cmsg{color:var(--bad);font-size:.85rem;min-height:1.2em}
.hide{display:none}
</style></head><body><main>
<h1>🍩 Brand Cash Ledger</h1>
<div class="row"><div><label>I am</label><select id="me"><option value="mostafa">Mostafa</option><option value="kamal">Kamal</option></select></div>
<div style="flex:3;align-self:flex-end"><span id="live" class="mut">Connecting…</span></div></div>
<div class="grid" id="bals"></div>
<div class="tabs"><button data-t="log" class="on">Log</button><button data-t="sum">Summary</button><button data-t="close">Close day</button><button data-t="set">Settings</button></div>

<section id="t-log">
<div class="card"><h2>Add a record</h2>
<div class="pre"><button data-p="in">Day's sales → pool</button><button data-p="give">Pool → owner</button><button data-p="spend">Spend</button><button data-p="swap">Owner ↔ owner</button></div>
<div class="row"><div><label>From</label><select id="from"></select></div><div><label>To</label><select id="to"></select></div><div><label>Amount (EGP)</label><input id="amt" type="number" inputmode="decimal" min="0" step="any"></div></div>
<div class="row"><div id="catW"><label>Category</label><select id="cat"></select></div><div><label>Why</label><input id="why" placeholder="e.g. flour, daily share"></div><div><label>Where / from whom</label><input id="where"></div><div><label>Handled by (optional)</label><select id="hb"><option value="">—</option><option value="mostafa">Mostafa</option><option value="kamal">Kamal</option></select></div></div>
<div class="row"><div><label>Receipt photo (optional)</label><input id="rc" type="file" accept="image/*"></div></div>
<button class="p" id="add">Add to log</button><div id="msg"></div></div>
<div class="card"><h2>Live log</h2><div class="row"><input id="q" placeholder="Search why, where, category, amount…"><select id="flt"><option value="">Everyone</option><option value="mostafa">Mostafa</option><option value="kamal">Kamal</option></select></div><ul class="log" id="log"></ul></div></section>

<section id="t-sum" class="hide"><div class="card"><div class="row"><div><label>Period</label><select id="per"><option value="today">Today</option><option value="week" selected>Last 7 days</option><option value="month">This month</option><option value="all">All time</option></select></div></div><div class="grid" id="ps"></div><br><button class="p" id="xl">Download all data as Excel</button><div id="xmsg" class="mut"></div></div>
<div class="card"><h2>Spending by category</h2><div id="bycat"></div></div>
<div class="card"><h2>Spending by owner</h2><div id="byown"></div></div>
<div class="card"><h2>Daily spending (last 14 days)</h2><div class="cols" id="cols"></div><div class="mut" id="colsl"></div></div></section>

<section id="t-close" class="hide"><div class="card"><h2>Close today</h2><div class="mut" id="dsum"></div><br>
<div class="mut">Count the cash you really hold and enter it. The ledger shows any difference.</div><br>
<div class="row"><div><label>Pool cash counted</label><input id="c_pool" type="number" step="any"></div><div><label>Mostafa cash counted</label><input id="c_mostafa" type="number" step="any"></div><div><label>Kamal cash counted</label><input id="c_kamal" type="number" step="any"></div></div>
<div id="diff" class="mut"></div><br><button class="p" id="closeBtn">Close day (locks today's records)</button><div id="cmsg"></div></div>
<div class="card"><h2>Closing history</h2><ul class="log" id="cl"></ul></div></section>

<section id="t-set" class="hide"><div class="card"><h2>Spending categories</h2><div class="row"><input id="nc" placeholder="New category"><button class="p" id="addc" style="flex:0 0 90px">Add</button></div><ul class="log" id="cats"></ul></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const A={sales:"Day's sales (POS)",pool:'Joint pool',mostafa:'Mostafa',kamal:'Kamal',own_mostafa:"Mostafa's own pocket",own_kamal:"Kamal's own pocket",spent:'Spent'};
const FR=['sales','pool','mostafa','kamal','own_mostafa','own_kamal'],TO=['pool','mostafa','kamal','spent','own_mostafa','own_kamal'];
const DEF=['Ingredients','Packaging','Salaries','Rent','Utilities','Transport','Equipment & maintenance','Marketing','Owner personal advance','Other'];
const $=id=>document.getElementById(id);let db=null,rows=[],cats=DEF.slice(),cl={};
const day=t=>new Date(t).toLocaleDateString('en-CA'),fmt=n=>(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
try{const m=localStorage.getItem('me');if(m)$('me').value=m}catch(e){}
$('me').onchange=()=>{try{localStorage.setItem('me',$('me').value)}catch(e){}};
function opts(s,list){s.innerHTML='';list.forEach(k=>{const o=el('option',0,A[k]||k);o.value=k;s.append(o)})}
opts($('from'),FR);opts($('to'),TO);
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));['log','sum','close','set'].forEach(t=>$('t-'+t).classList.toggle('hide',t!=b.dataset.t));render()});
const PR={in:['sales','pool'],give:['pool','mostafa'],spend:['pool','spent'],swap:['mostafa','kamal']};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const p=PR[b.dataset.p];$('from').value=p[0];$('to').value=p[1];catv()});
function catv(){$('catW').style.display=$('to').value=='spent'?'':'none'}$('to').onchange=catv;catv();
function bal(){const b={};[...FR,...TO].forEach(k=>b[k]=0);for(const r of rows){if(r.void)continue;b[r.from]-=r.amount;b[r.to]+=r.amount}return b}
function locked(r){const c=cl[day(r.ts)];return c&&c.ts>=r.ts}
function who(r){return r.from=='mostafa'||r.from=='own_mostafa'?'mostafa':r.from=='kamal'||r.from=='own_kamal'?'kamal':(r.hb||r.by)}
function inP(ts,p){const n=Date.now();return p=='all'||(p=='today'?day(ts)==day(n):p=='week'?ts>=n-7*864e5:new Date(ts).getMonth()==new Date(n).getMonth()&&new Date(ts).getFullYear()==new Date(n).getFullYear())}
function card(box,l,v,cls){const d=el('div','bal');d.append(el('span','mut',l));const b=el('b',cls||'',fmt(v));d.append(b);box.append(d)}
function bars(box,map){box.innerHTML='';const e=Object.entries(map).sort((a,b)=>b[1]-a[1]),mx=e.length?e[0][1]:1,tot=e.reduce((s,x)=>s+x[1],0);
 if(!e.length)box.append(el('div','mut','No spending in this period.'));
 e.forEach(([k,v])=>{const r=el('div','bar');r.append(el('span',0,k));const i=el('i');i.style.width=Math.max(2,v/mx*55)+'%';r.append(i,el('span','mut',fmt(v)+' ('+Math.round(v/tot*100)+'%)'));box.append(r)})}
function render(){
 const b=bal(),B=$('bals');B.innerHTML='';
 card(B,'Joint pool',b.pool);card(B,'Mostafa holds',b.mostafa);card(B,'Kamal holds',b.kamal);card(B,'Brand total cash',b.pool+b.mostafa+b.kamal);
 if(b.own_mostafa<-0.005)card(B,'Brand owes Mostafa',-b.own_mostafa,'out');if(b.own_kamal<-0.005)card(B,'Brand owes Kamal',-b.own_kamal,'out');
 // log
 const f=$('flt').value,q=$('q').value.trim().toLowerCase(),ul=$('log');ul.innerHTML='';
 const L=rows.filter(r=>(!f||r.from==f||r.to==f||r.by==f||r.hb==f||r.from=='own_'+f||r.to=='own_'+f)&&(!q||[r.why,r.where,r.cat,String(r.amount),A[r.from],A[r.to]].join(' ').toLowerCase().includes(q)));
 if(!L.length)ul.append(el('li','mut','No records.'));
 for(const r of L){const li=el('li',r.void?'v':''),l=el('div'),a=r.to=='spent'?'out':(r.from=='sales'?'in':'tr');
  l.append(el('div',0,A[r.from]+' → '+A[r.to]+(r.cat?' · '+r.cat:'')+(r.why?' · '+r.why:'')));
  l.append(el('div','mut',new Date(r.ts).toLocaleString([],{dateStyle:'medium',timeStyle:'short'})+(r.where?' · '+r.where:'')+' · by '+(A[r.by]||r.by)+(r.hb?' · handled by '+A[r.hb]:'')+(r.void?' · VOIDED by '+(A[r.voidBy]||''):'')));
  const rt=el('div','amt');rt.append(el('div',a,fmt(r.amount)));
  if(r.receipt){const a=el('a','mut','🧾 Receipt');a.href='/_blob/'+r.receipt;a.target='_blank';a.rel='noopener';a.style.display='block';rt.append(a)}
  if(!r.void){if(locked(r))rt.append(el('div','mut','🔒 closed'));else{if(!r.receipt&&r.to=='spent'){const f=el('button','s','+ Receipt');f.onclick=()=>attach(r.id);rt.append(f)}const v=el('button','s','Void');v.onclick=()=>voidIt(r.id);rt.append(v)}}
  li.append(l,rt);ul.append(li)}
 // summary
 const per=$('per').value,P=rows.filter(r=>!r.void&&inP(r.ts,per));let sales=0,sp=0,give=0;const bc={},bo={};
 for(const r of P){if(r.from=='sales')sales+=r.amount;if(r.from=='pool'&&(r.to=='mostafa'||r.to=='kamal'))give+=r.amount;
  if(r.to=='spent'){sp+=r.amount;const c=r.cat||'Uncategorized';bc[c]=(bc[c]||0)+r.amount;const w=A[who(r)]||'—';bo[w]=(bo[w]||0)+r.amount}}
 const S=$('ps');S.innerHTML='';card(S,'Sales',sales,'in');card(S,'Spending',sp,'out');card(S,'Sales − spending',sales-sp);card(S,'Handed to owners',give);
 bars($('bycat'),bc);bars($('byown'),bo);
 const cols=$('cols');cols.innerHTML='';const ds=[];for(let i=13;i>=0;i--)ds.push(day(Date.now()-i*864e5));
 const tot=ds.map(d=>rows.filter(r=>!r.void&&r.to=='spent'&&day(r.ts)==d).reduce((s,r)=>s+r.amount,0)),mx=Math.max(1,...tot);
 tot.forEach((v,i)=>{const c=el('div');c.style.height=(v/mx*100)+'%';c.title=ds[i]+': '+fmt(v);cols.append(c)});$('colsl').textContent='Highest day: '+fmt(mx>1?mx:0)+' EGP · tap a bar to see its day and amount';
 // close
 const td=day(Date.now()),T=rows.filter(r=>!r.void&&day(r.ts)==td);let ts=0,tsp=0,tp=0;
 T.forEach(r=>{if(r.from=='sales')ts+=r.amount;if(r.to=='spent')tsp+=r.amount;if(r.from=='pool'&&(r.to=='mostafa'||r.to=='kamal'))tp+=r.amount});
 $('dsum').textContent='Today: sales '+fmt(ts)+' · spent '+fmt(tsp)+' · handed to owners '+fmt(tp)+' · ledger says pool '+fmt(b.pool)+', Mostafa '+fmt(b.mostafa)+', Kamal '+fmt(b.kamal);
 const d=['pool','mostafa','kamal'].map(k=>{const v=$('c_'+k).value;return v===''?null:parseFloat(v)-b[k]});
 $('diff').textContent=d.every(x=>x==null)?'':'Difference vs ledger: pool '+(d[0]==null?'—':fmt(d[0]))+', Mostafa '+(d[1]==null?'—':fmt(d[1]))+', Kamal '+(d[2]==null?'—':fmt(d[2]));
 $('closeBtn').disabled=!!cl[td];$('closeBtn').textContent=cl[td]?'Today is closed':'Close day (locks today\'s records)';
 const cu=$('cl');cu.innerHTML='';const ck=Object.values(cl).sort((a,b)=>b.ts-a.ts).slice(0,30);if(!ck.length)cu.append(el('li','mut','No closings yet.'));
 ck.forEach(c=>{const li=el('li'),l=el('div');l.append(el('div',0,c.day+' · closed by '+(A[c.by]||c.by)),el('div','mut','Difference: pool '+fmt(c.diff.pool)+', Mostafa '+fmt(c.diff.mostafa)+', Kamal '+fmt(c.diff.kamal)));li.append(l);cu.append(li)});
 // categories
 const cu2=$('cats');cu2.innerHTML='';cats.forEach(c=>{const li=el('li');li.append(el('div',0,c));const x=el('button','s','Remove');x.onclick=()=>saveCats(cats.filter(k=>k!=c));li.append(x);cu2.append(li)});
 const cs=$('cat'),cv=cs.value;cs.innerHTML='';cats.forEach(c=>{const o=el('option',0,c);o.value=c;cs.append(o)});if(cats.includes(cv))cs.value=cv;
}
['q','flt','per'].forEach(i=>$(i).oninput=render);['c_pool','c_mostafa','c_kamal'].forEach(i=>$(i).oninput=render);
async function voidIt(id){if(!confirm('Void this record? It stays in the log but stops counting.'))return;
 try{await db.doc('entries/'+id).update({void:true,voidBy:$('me').value,voidTs:Date.now()})}catch(e){$('msg').textContent='Could not void: '+(e.message||e.code)}}
async function saveCats(l){try{await db.doc('settings/cats').set({list:l})}catch(e){alert('Could not save: '+(e.message||e.code))}}
$('addc').onclick=()=>{const v=$('nc').value.trim();if(v&&!cats.includes(v)){saveCats([...cats,v]);$('nc').value=''}};
$('add').onclick=async()=>{$('msg').textContent='';const amount=parseFloat($('amt').value),from=$('from').value,to=$('to').value;
 if(!db)return $('msg').textContent='Not connected. Open signed in to claude.ai.';
 if(!(amount>0))return $('msg').textContent='Enter an amount above 0.';
 if(from==to)return $('msg').textContent='From and To must be different.';
 if(from=='sales'&&to!='pool')return $('msg').textContent="Day's sales can only go into the pool.";
 if(!$('why').value.trim())return $('msg').textContent='Please add a reason (why).';
 const r={ts:Date.now(),from,to,amount,why:$('why').value.trim(),where:$('where').value.trim(),by:$('me').value,hb:$('hb').value,void:false};
 if(to=='spent')r.cat=$('cat').value;
 try{const f=$('rc').files[0];if(f){$('msg').textContent='Uploading receipt…';r.receipt=await up(f)}
 await db.collection('entries').add(r);$('amt').value='';$('why').value='';$('where').value='';$('rc').value='';$('msg').textContent=''}
 catch(e){$('msg').textContent=e.code=='invalid_argument'?'You need Contributor access or higher to add records.':'Could not save: '+(e.message||e.code)}};
let assets=null;
function shrink(f){return new Promise(res=>{if(!f.type.startsWith('image/'))return res(f);const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||f),'image/jpeg',.82)};i.onerror=()=>res(f);i.src=u})}
async function up(f){if(!assets)throw new Error('Receipt upload is not available for your access level');const r=await assets.upload(await shrink(f));return r.id}
function attach(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;try{const rid=await up(i.files[0]);await db.doc('entries/'+id).update({receipt:rid})}catch(e){alert('Could not attach: '+(e.message||e.code))}};i.click()}
$('xl').onclick=async()=>{const m=$('xmsg');m.textContent='';
 try{const dl=await claude.use('downloads');if(!dl||!window.XLSX)return m.textContent='Excel export is not available here.';
 const R=rows.slice().sort((a,b)=>a.ts-b.ts).map(r=>({Date:day(r.ts),Time:new Date(r.ts).toLocaleTimeString(),From:A[r.from],To:A[r.to],Amount:r.amount,Category:r.cat||'',Why:r.why||'',Where:r.where||'','Entered by':A[r.by]||r.by,'Handled by':A[r.hb]||'',Status:r.void?'VOIDED':'Active',Receipt:r.receipt?'Yes':'No'}));
 const bc={};rows.forEach(r=>{if(!r.void&&r.to=='spent'){const c=r.cat||'Uncategorized';bc[c]=(bc[c]||0)+r.amount}});
 const C=Object.entries(bc).map(([k,v])=>({Category:k,Total:v}));
 const K=Object.values(cl).sort((a,b)=>a.ts-b.ts).map(c=>({Day:c.day,'Closed by':A[c.by]||c.by,'Pool diff':c.diff.pool,'Mostafa diff':c.diff.mostafa,'Kamal diff':c.diff.kamal}));
 const b=bal(),Bl=[{Account:'Joint pool',Balance:b.pool},{Account:'Mostafa',Balance:b.mostafa},{Account:'Kamal',Balance:b.kamal},{Account:"Mostafa's own pocket (negative = brand owes him)",Balance:b.own_mostafa},{Account:"Kamal's own pocket (negative = brand owes him)",Balance:b.own_kamal}];
 const wb=XLSX.utils.book_new();[['Records',R],['Spending by category',C],['Balances',Bl],['Closings',K]].forEach(([n,d])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(d.length?d:[{}]),n));
 await dl.save({filename:'brand-ledger-'+day(Date.now())+'.xlsx',data:XLSX.write(wb,{type:'array',bookType:'xlsx'})})}
 catch(e){m.textContent='Export not saved: '+(e.message||e.code)}};
$('closeBtn').onclick=async()=>{const b=bal(),td=day(Date.now()),v=k=>$('c_'+k).value;
 if(!db||['pool','mostafa','kamal'].some(k=>v(k)===''))return $('cmsg').textContent='Enter all three counted amounts first.';
 if(!confirm('Close today? Records made so far will be locked (only a visible void can change them).'))return;
 try{await db.doc('closings/'+td).set({day:td,ts:Date.now(),by:$('me').value,counted:{pool:+v('pool'),mostafa:+v('mostafa'),kamal:+v('kamal')},diff:{pool:v('pool')-b.pool,mostafa:v('mostafa')-b.mostafa,kamal:v('kamal')-b.kamal}});$('cmsg').textContent=''}
 catch(e){$('cmsg').textContent='Could not close: '+(e.message||e.code)}};
(async()=>{try{db=await claude.use('db')}catch(e){db=null}
 try{assets=await claude.use('assets')}catch(e){assets=null}
 if(!db){$('live').textContent='Offline: open signed in to claude.ai.';return}
 $('live').textContent='● Live: changes from either owner appear instantly.';
 const er=e=>$('live').textContent='Connection problem: '+(e.message||e.code);
 db.collection('entries').orderBy('ts','desc').limit(1000).onSnapshot(s=>{rows=s.docs.map(d=>({id:d.id,...d.data()}));render()},er);
 db.collection('closings').onSnapshot(s=>{cl={};s.docs.forEach(d=>cl[d.id]=d.data());render()},er);
 db.doc('settings/cats').onSnapshot(s=>{cats=s.exists&&s.data().list?s.data().list:DEF.slice();render()},er);
})();render();
</script></body></html>
